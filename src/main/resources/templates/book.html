<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ticket Booking</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-primary text-white text-center">
                    <h3>Ticket Booking</h3>
                </div>

                <div class="card-body">

                    <form th:action="@{/booking/save}" th:object="${ticket}" method="post">

                        <!-- First Name -->
                        <div class="mb-3">
                            <label class="form-label">First Name</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{fname}"
                                   placeholder="Enter First Name">
                        </div>

                        <!-- Last Name -->
                        <div class="mb-3">
                            <label class="form-label">Last Name</label>
                            <input type="text"
                                   class="form-control"
                                   th:field="*{lname}"
                                   placeholder="Enter Last Name">
                        </div>

                        <!-- From City -->
                        <div class="mb-3">
                            <label class="form-label">From City</label>

                            <select class="form-select" th:field="*{fromCity}">
                                <option value="">-- Select From City --</option>

                                <option th:each="cityObj : ${cities}"
                                        th:value="${cityObj.city}"
                                        th:text="${cityObj.city}">
                                </option>
                            </select>
                        </div>

                        <!-- To City -->
                        <div class="mb-4">
                            <label class="form-label">To City</label>

                            <select class="form-select" th:field="*{toCity}">
                                <option value="">-- Select To City --</option>

                                <option th:each="cityObj : ${cities}"
                                        th:value="${cityObj.city}"
                                        th:text="${cityObj.city}">
                                </option>
                            </select>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success btn-lg">
                                Book Ticket
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
